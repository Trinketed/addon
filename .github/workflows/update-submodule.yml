name: Update Submodule

on:
  workflow_dispatch:
    inputs:
      submodule:
        description: "Submodule to update (TrinketedCD or TrinketedHistory)"
        required: true

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          token: ${{ secrets.RELEASE_TOKEN }}

      - name: Update submodule
        env:
          SUBMODULE: ${{ inputs.submodule }}
        run: |
          git submodule update --remote "$SUBMODULE"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add "$SUBMODULE"
          git diff --cached --quiet || git commit -m "update $SUBMODULE submodule"
          git push
