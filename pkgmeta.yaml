package-as: Trinketed

externals:
  Libs/LibStub: https://repos.wowace.com/wow/libstub/trunk
  Libs/LibDeflate:
    url: https://github.com/SafeteeWoW/LibDeflate
    tag: latest
  Libs/DRList-1.0:
    url: https://github.com/wardz/DRList-1.0
    tag: latest

move-folders:
  Trinketed/TrinketedCD: TrinketedCD
  Trinketed/TrinketedHistory: TrinketedHistory

# Local-only modules: in the repo (and loaded on dev machines) but kept out
# of the packaged CurseForge build until they're ready to ship.
ignore:
  - .github
  - docs
  - tools
  - addons.json
  - .claude
  - "*.md"
  - .gitignore
  - TrinketedAuras
  - TrinketedLC
  - TrinketedLOS
